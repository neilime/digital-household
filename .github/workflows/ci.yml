name: Continuous integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    with:
      linter-env: |
        FILTER_REGEX_EXCLUDE=/(\.cache|\.reports)/
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  vm:
    uses: hoverkraft-tech/ci-github-iac/.github/workflows/vm-e2e.yml@bca459a1502cb1c87a14d8267b45e98d135d8a4f
  checks:
    if: ${{ always() }}
    needs: [linter, vm]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values())
          PYTHON
