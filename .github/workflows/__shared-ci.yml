---
name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    with:
      linter-env: |
        FILTER_REGEX_EXCLUDE=/(\.cache|\.reports)/
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create VM
        id: vm
        uses: hoverkraft-tech/ci-github-iac/actions/vm/create@acda463791a5dc7403929f0aba39f993fa89c4de
      - name: Execute guest assertions
        id: test
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@acda463791a5dc7403929f0aba39f993fa89c4de
        with:
          vm: ${{ steps.vm.outputs.vm }}
          test-script: tests/e2e.sh
      - name: Destroy VM
        if: ${{ always() && steps.vm.outputs.vm != '' }}
        uses: hoverkraft-tech/ci-github-iac/actions/vm/destroy@acda463791a5dc7403929f0aba39f993fa89c4de
        with:
          vm: ${{ steps.vm.outputs.vm }}
      - name: Upload assertion report
        if: ${{ always() && steps.test.outputs.report != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-${{ github.job }}-${{ steps.vm.outputs.id }}
          path: ${{ steps.test.outputs.report }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  checks:
    if: ${{ always() }}
    needs: [linter, vm]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values())
          PYTHON
