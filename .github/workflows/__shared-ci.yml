---
name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    with:
      linter-env: |
        FILTER_REGEX_EXCLUDE=/(\.cache|\.reports)/
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate in disposable VM
        uses: hoverkraft-tech/ci-github-iac/actions/vm-e2e@f8ab7bf7a91ed562e9de5cdfc3b0c0d9b05c4b21
        with:
          test-script: tests/e2e.sh
  checks:
    if: ${{ always() }}
    needs: [linter, vm]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values())
          PYTHON
