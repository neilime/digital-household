---
name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    with:
      linter-env: |
        FILTER_REGEX_EXCLUDE=/(\.cache|\.reports)/
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create VM
        id: vm
        uses: hoverkraft-tech/ci-github-iac/actions/vm/create@19658c3dffdcf3d6ea8b04895e46bb8e64e9208a
        with:
          vm-config: tests/lima.yml
      - name: Execute guest assertions
        id: test
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@19658c3dffdcf3d6ea8b04895e46bb8e64e9208a
        with:
          vm: ${{ steps.vm.outputs.vm }}
          test-script: tests/e2e.sh
      - name: Destroy VM
        if: ${{ always() && steps.vm.outputs.vm != '' }}
        uses: hoverkraft-tech/ci-github-iac/actions/vm/destroy@19658c3dffdcf3d6ea8b04895e46bb8e64e9208a
        with:
          vm: ${{ steps.vm.outputs.vm }}
      - name: Summarize assertion report
        if: ${{ always() && (steps.test.outputs.report != '' || steps.test.outputs.report-files != '') }}
        uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
        with:
          report-name: VM assertions
          report-paths: ${{ steps.test.outputs.report-files || steps.test.outputs.report }}
          output-format: summary,annotations
      - name: Upload assertion report
        if: ${{ always() && (steps.test.outputs.report != '' || steps.test.outputs.report-files != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-${{ github.job }}-${{ steps.vm.outputs.id }}
          path: |
            ${{ steps.test.outputs.report }}
            ${{ steps.test.outputs.report-files }}
          if-no-files-found: error
          retention-days: 7
  checks:
    if: ${{ always() }}
    needs: [linter, vm]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const results = Object.values(JSON.parse(process.env.RESULTS));
            if (!results.every(job => job.result === 'success')) core.setFailed('A required check did not succeed');
