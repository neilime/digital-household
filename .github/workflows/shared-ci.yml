---
name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  bootstrap:
    name: Proxmox bootstrap validation
    env:
      TOOLING_IMAGE: digital-household-tooling:local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate installer inputs
        run: make test-unit TOOLING_IMAGE="$TOOLING_IMAGE"
      - name: Test Ansible
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@5c4b7307d7a2c58a01a3b62607cebde65f96b0a2 # 0.2.0
        with:
          ansible-requirements: docker/tooling/requirements.txt
          ansible-config: ansible/ansible.cfg
          test-playbook: tests/proxmox-test.yml
          report-name: digital-household - Ansible tests
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create VM
        id: vm
        uses: hoverkraft-tech/ci-github-iac/actions/vm/create@5c4b7307d7a2c58a01a3b62607cebde65f96b0a2 # 0.2.0
        with:
          vm-config: tests/lima.yml
      - name: Execute guest assertions
        id: test
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@5c4b7307d7a2c58a01a3b62607cebde65f96b0a2 # 0.2.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          test-script: tests/e2e.sh
          report-name: digital-household - VM tests
      - name: Destroy VM
        if: ${{ always() && steps.vm.outputs.vm != '' }}
        uses: hoverkraft-tech/ci-github-iac/actions/vm/destroy@5c4b7307d7a2c58a01a3b62607cebde65f96b0a2 # 0.2.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
