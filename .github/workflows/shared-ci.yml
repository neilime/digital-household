---
name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
  bootstrap:
    name: Proxmox bootstrap validation
    env:
      TOOLING_IMAGE: digital-household-tooling:local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate installer inputs
        run: make test-unit TOOLING_IMAGE="$TOOLING_IMAGE"
      - name: Test Ansible
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@5c4b7307d7a2c58a01a3b62607cebde65f96b0a2 # 0.2.0
        with:
          ansible-requirements: docker/tooling/requirements.txt
          ansible-config: ansible/ansible.cfg
          test-playbook: tests/proxmox-test.yml
          report-name: digital-household - Ansible tests
  installation:
    name: Proxmox installation E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare synthetic installation identity
        id: fixture
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: require('./.github/scripts/proxmox-e2e.cjs').prepare({ core });
      - name: Build verified unattended ISO and test container
        env:
          E2E_DIRECTORY: ${{ steps.fixture.outputs.directory }}
        run: make proxmox-download proxmox-iso setup-e2e ANSWER="$E2E_DIRECTORY/answer.toml" OUTPUT="$E2E_DIRECTORY/autoinstall.iso"
      - name: Execute installation assertions
        id: test
        timeout-minutes: 40
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          E2E_DIRECTORY: ${{ steps.fixture.outputs.directory }}
        with:
          script: await require('./.github/scripts/proxmox-e2e.cjs').run({ exec, core });
      - name: Parse installation reports
        if: ${{ always() && steps.test.outputs.report != '' }}
        id: reports
        uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
        with:
          report-name: digital-household - Proxmox installation
          report-paths: ${{ steps.test.outputs.report }}
          output-format: summary,markdown,annotations
      - name: Update installation PR comment
        if: >-
          ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && steps.reports.outputs.markdown != '' }}
        uses: hoverkraft-tech/ci-github-common/actions/create-or-update-comment@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
        with:
          title: digital-household - Proxmox installation
          body: ${{ steps.reports.outputs.markdown }}
      - name: Upload installation report
        if: ${{ always() && steps.test.outputs.report != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxmox-installation-report
          path: ${{ steps.test.outputs.report }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload synthetic installer console
        if: ${{ failure() && steps.test.outputs.console != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxmox-installer-console
          path: ${{ steps.test.outputs.console }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Remove test container and private installation inputs
        if: ${{ always() && steps.fixture.outputs.directory != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          E2E_DIRECTORY: ${{ steps.fixture.outputs.directory }}
        with:
          script: await require('./.github/scripts/proxmox-e2e.cjs').cleanup({ exec });
