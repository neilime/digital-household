version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: "chore"
      include: "scope"
    directory: /
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker
    commit-message:
      prefix: "chore"
      include: "scope"
    directories:
      - /
      - /docker/tooling
    groups:
      docker-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: pip
    commit-message:
      prefix: "chore"
      include: "scope"
    directories:
      - /docker/tooling
    groups:
      python-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
