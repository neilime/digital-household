version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /docker/tooling
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /docker/tooling
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
