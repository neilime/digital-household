version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /docker/tooling
    groups:
      docker-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /docker/tooling
      - /tests/proxmox
    groups:
      python-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
