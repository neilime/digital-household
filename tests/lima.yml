vmType: qemu
arch: x86_64
cpus: 4
memory: 6GiB
disk: 30GiB
plain: true
vmOpts:
  qemu:
    cpuType:
      x86_64: host
images:
  - location: https://cloud-images.ubuntu.com/releases/resolute/release-20261016/ubuntu-26.04-server-cloudimg-amd64.img
    arch: x86_64
    digest: sha256:5645d0318ad21f643ebb1ac4567514620e9893380b07b0201fda163baa5b7eb5
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      test -c /dev/kvm
      apt-get update
      apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf python3-venv
      chown '{{.UID}}' /dev/kvm
      touch /etc/digital-household-disposable-test
