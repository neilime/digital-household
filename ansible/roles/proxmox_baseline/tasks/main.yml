---
- name: Require an explicit package channel
  ansible.builtin.assert:
    that: proxmox_repository_channel in ['enterprise', 'no-subscription']

- name: Configure the Proxmox package channel
  ansible.builtin.template:
    src: proxmox.sources.j2
    dest: /etc/apt/sources.list.d/digital-household-proxmox.sources
    owner: root
    group: root
    mode: "0644"

- name: Disable installer repository entries managed by this baseline
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - pve-enterprise.sources
    - ceph.sources

- name: Disable password and forwarded-agent SSH authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-digital-household.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      AllowAgentForwarding no
      X11Forwarding no
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH
